
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - script: dotnet --version
    displayName: 'Verify .NET SDK Version'

  - script: |
      echo "EnterpriseLMS Pipeline Started"
      echo "GitHub Integration Successful"
      echo "Branch: $(Build.SourceBranch)"
      echo "Build ID: $(Build.BuildId)"
    displayName: 'Verify Pipeline Configuration'
