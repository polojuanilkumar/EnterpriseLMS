
trigger:
  branches:
    include:
      - main

pr: none

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  solution: 'EnterpriseLMS.slnx'
  webApiProject: 'EnterpriseLMS.API/EnterpriseLMS.API.csproj'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build EnterpriseLMS'

    jobs:
      - job: BuildApplication
        displayName: 'Build and Package Web API'

        steps:

          # Step 1: Checkout GitHub source code
          - checkout: self
            clean: true

          # Step 2: Install .NET 10 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          # Step 3: Verify SDK version
          - script: dotnet --version
            displayName: 'Verify .NET SDK Version'

          # Step 4: Verify solution and project paths
          - script: |
              echo "Available solution and project files:"

              find "$(Build.SourcesDirectory)" -type f \
                \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \)

              echo "Configured solution: $(solution)"
              echo "Configured project: $(webApiProject)"

              if [ ! -f "$(Build.SourcesDirectory)/$(solution)" ]; then
                echo "ERROR: Solution file not found"
                exit 1
              fi

              if [ ! -f "$(Build.SourcesDirectory)/$(webApiProject)" ]; then
                echo "ERROR: Web API project file not found"
                exit 1
              fi

              echo "Solution and project paths verified successfully"
            displayName: 'Verify Solution and Project Paths'

          # Step 5: Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # Step 6: Build solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Step 7: Report test status
          - script: |
              echo "No test project configured."
              echo "Automated unit tests were not executed."
            displayName: 'Report Test Status'

          # Step 8: Publish Web API
          - task: DotNetCoreCLI@2
            displayName: 'Publish Web API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(webApiProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: false
              modifyOutputPath: false

          # Step 9: Create ZIP package
          - task: ArchiveFiles@2
            displayName: 'Create Deployment ZIP'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/EnterpriseLMS.zip'
              replaceExistingArchive: true

          # Step 10: Publish pipeline artifact
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Deployment Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/EnterpriseLMS.zip'
              artifact: 'drop'
              publishLocation: 'pipeline'
