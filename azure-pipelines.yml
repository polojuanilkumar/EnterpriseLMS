
trigger:
  branches:
    include:
      - main

pr: none

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  solution: 'EnterpriseLMS.slnx'
  webApiProject: 'LMS.Api/LMS.Api.csproj'
  testProject: 'LMS.Tests/LMS.Tests.csproj'
  azureWebAppName: 'app-enterpriselms-api-dev'

pool:
  vmImage: 'ubuntu-latest'

stages:

  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # ==========================================

  - stage: Build
    displayName: 'CI - Build EnterpriseLMS'

    jobs:
      - job: BuildApplication
        displayName: 'Build and Package Web API'

        steps:

          # Checkout source code
          - checkout: self
            clean: true

          # Install .NET 10 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          # Verify SDK version
          - script: dotnet --version
            displayName: 'Verify .NET SDK Version'

          # Verify project paths
          - script: |
              echo "Available solution and project files:"

              find "$(Build.SourcesDirectory)" -type f \
                \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \)

              for file in "$(solution)" "$(webApiProject)" "$(testProject)"; do
                if [ ! -f "$(Build.SourcesDirectory)/$file" ]; then
                  echo "ERROR: File not found: $file"
                  exit 1
                fi
              done

              echo "All project paths verified successfully"
            displayName: 'Verify Solution and Project Paths'

          # Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # Build solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Execute automated tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration)'
              publishTestResults: true

          # Publish API
          - task: DotNetCoreCLI@2
            displayName: 'Publish Web API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(webApiProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: false
              modifyOutputPath: false

          # Create deployment ZIP
          - task: ArchiveFiles@2
            displayName: 'Create Deployment ZIP'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/EnterpriseLMS.zip'
              replaceExistingArchive: true

          # Publish artifact
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Deployment Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/EnterpriseLMS.zip'
              artifact: 'drop'
              publishLocation: 'pipeline'

  # ==========================================
  # STAGE 2: CONTINUOUS DEPLOYMENT
  # ==========================================

  - stage: Deploy
    displayName: 'CD - Deploy to Azure DEV'

    dependsOn: Build

    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: DeployWebAPI
        displayName: 'Deploy EnterpriseLMS Web API'

        environment: 'EnterpriseLMS-DEV'

        strategy:
          runOnce:
            deploy:
              steps:

                # Deployment consumes artifact only
                - checkout: none

                # Disable implicit artifact download
                - download: none

                # Download CI artifact
                - download: current
                  artifact: drop
                  displayName: 'Download Deployment Artifact'

                # Verify deployment package
                - script: |
                    echo "Verifying deployment package..."

                    ZIP_FILE="$(Pipeline.Workspace)/drop/EnterpriseLMS.zip"

                    if [ ! -f "$ZIP_FILE" ]; then
                      echo "ERROR: Deployment ZIP not found"
                      exit 1
                    fi

                    ls -lh "$ZIP_FILE"

                    unzip -t "$ZIP_FILE"

                    if [ $? -ne 0 ]; then
                      echo "ERROR: Invalid ZIP package"
                      exit 1
                    fi

                    echo "Deployment package verified"
                  displayName: 'Verify Deployment Package'

                # Deploy to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy Web API to Azure App Service'
                  inputs:
                    azureSubscription: 'sc-enterpriselms-dev'
                    appType: 'webAppLinux'
                    appName: '$(azureWebAppName)'
                    package: '$(Pipeline.Workspace)/drop/EnterpriseLMS.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
                    startUpCommand: 'dotnet LMS.Api.dll'

                # Deployment completion message
                - script: |
                    echo "Azure App Service deployment task completed."
                    echo "Application: $(azureWebAppName)"
                    echo "Build ID: $(Build.BuildId)"
                    echo "Commit: $(Build.SourceVersion)"
                    echo "Runtime verification is required."
                  displayName: 'Deployment Summary'
