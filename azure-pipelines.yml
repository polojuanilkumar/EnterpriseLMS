
trigger:
  branches:
    include:
      - main

pr: none

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  solution: 'EnterpriseLMS.slnx'

  webApiProject: 'LMS.Api/LMS.Api.csproj'
  webProject: 'LMS.Web/LMS.Web.csproj'
  testProject: 'LMS.Tests/LMS.Tests.csproj'

  azureWebAppName: 'app-enterpriselms-api-dev'
  azureBffAppName: 'app-enterpriselms-web-dev'

pool:
  vmImage: 'ubuntu-latest'

stages:

  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # ==========================================

  - stage: Build
    displayName: 'CI - Build EnterpriseLMS'

    jobs:
      - job: BuildApplication
        displayName: 'Build and Package API and BFF'

        steps:

          # Checkout source code
          - checkout: self
            clean: true

          # Install .NET 10 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          # Verify SDK version
          - script: dotnet --version
            displayName: 'Verify .NET SDK Version'

          # Verify solution and project paths
          - script: |
              echo "Available solution and project files:"

              find "$(Build.SourcesDirectory)" -type f \
                \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \)

              for file in "$(solution)" "$(webApiProject)" "$(webProject)" "$(testProject)"; do
                if [ ! -f "$(Build.SourcesDirectory)/$file" ]; then
                  echo "ERROR: File not found: $file"
                  exit 1
                fi
              done

              echo "All project paths verified successfully"
            displayName: 'Verify Solution and Project Paths'

          # Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          # Build complete solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Execute automated tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration)'
              publishTestResults: true

          # ==================================
          # PUBLISH LMS.API
          # ==================================

          - task: DotNetCoreCLI@2
            displayName: 'Publish Web API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(webApiProject)'
              arguments: >
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)/api-publish
              zipAfterPublish: false
              modifyOutputPath: false

          # ==================================
          # PUBLISH LMS.WEB BFF
          # ==================================

          - task: DotNetCoreCLI@2
            displayName: 'Publish LMS.Web BFF'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(webProject)'
              arguments: >
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)/bff-publish
              zipAfterPublish: false
              modifyOutputPath: false

          # Verify published applications
          - script: |
              set -e

              API_PATH="$(Build.ArtifactStagingDirectory)/api-publish"
              BFF_PATH="$(Build.ArtifactStagingDirectory)/bff-publish"

              echo "Verifying published applications..."

              if [ ! -f "$API_PATH/LMS.Api.dll" ]; then
                echo "ERROR: LMS.Api.dll not found"
                exit 1
              fi

              if [ ! -f "$BFF_PATH/LMS.Web.dll" ]; then
                echo "ERROR: LMS.Web.dll not found"
                exit 1
              fi

              echo "Both applications published successfully."

              ls -lh "$API_PATH"
              ls -lh "$BFF_PATH"

              mkdir -p "$(Build.ArtifactStagingDirectory)/packages"

            displayName: 'Verify Published Applications'

          # ==================================
          # PACKAGE LMS.API
          # ==================================

          - task: ArchiveFiles@2
            displayName: 'Create API Deployment ZIP'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api-publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/packages/EnterpriseLMS.zip'
              replaceExistingArchive: true

          # ==================================
          # PACKAGE LMS.WEB BFF
          # ==================================

          - task: ArchiveFiles@2
            displayName: 'Create BFF Deployment ZIP'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/bff-publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/packages/LMS.Web.zip'
              replaceExistingArchive: true

          # Verify both ZIP packages
          - script: |
              set -e

              PACKAGE_PATH="$(Build.ArtifactStagingDirectory)/packages"

              echo "Verifying deployment packages..."

              for package in EnterpriseLMS.zip LMS.Web.zip; do

                ZIP_FILE="$PACKAGE_PATH/$package"

                if [ ! -f "$ZIP_FILE" ]; then
                  echo "ERROR: Package not found: $package"
                  exit 1
                fi

                unzip -tq "$ZIP_FILE"

                ls -lh "$ZIP_FILE"

              done

              echo "Both deployment packages verified successfully."

            displayName: 'Verify Both Deployment Packages'

          # Publish both packages as a single artifact
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Deployment Artifacts'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/packages'
              artifact: 'drop'
              publishLocation: 'pipeline'

  # ==========================================
  # STAGE 2: DEPLOY LMS.API
  # ==========================================

  - stage: Deploy
    displayName: 'CD - Deploy LMS.Api to Azure DEV'

    dependsOn: Build

    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: DeployWebAPI
        displayName: 'Deploy EnterpriseLMS Web API'

        environment: 'EnterpriseLMS-DEV'

        strategy:
          runOnce:
            deploy:
              steps:

                # Deployment consumes artifact only
                - checkout: none

                # Disable implicit artifact download
                - download: none

                # Download CI artifact
                - download: current
                  artifact: drop
                  displayName: 'Download Deployment Artifact'

                # Verify API deployment package
                - script: |
                    set -e

                    echo "Verifying API deployment package..."

                    ZIP_FILE="$(Pipeline.Workspace)/drop/EnterpriseLMS.zip"

                    if [ ! -f "$ZIP_FILE" ]; then
                      echo "ERROR: API deployment ZIP not found"
                      exit 1
                    fi

                    ls -lh "$ZIP_FILE"

                    unzip -tq "$ZIP_FILE"

                    echo "API deployment package verified"

                  displayName: 'Verify API Deployment Package'

                # Deploy API to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy Web API to Azure App Service'
                  inputs:
                    azureSubscription: 'sc-enterpriselms-dev'
                    appType: 'webAppLinux'
                    appName: '$(azureWebAppName)'
                    package: '$(Pipeline.Workspace)/drop/EnterpriseLMS.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
                    startUpCommand: 'dotnet LMS.Api.dll'

                # API deployment summary
                - script: |
                    echo "API deployment task completed."
                    echo "Application: $(azureWebAppName)"
                    echo "Build ID: $(Build.BuildId)"
                    echo "Commit: $(Build.SourceVersion)"
                    echo "Runtime verification is required."

                  displayName: 'API Deployment Summary'

  # ==========================================
  # STAGE 3: DEPLOY LMS.WEB BFF
  # ==========================================

  - stage: DeployBff
    displayName: 'CD - Deploy LMS.Web BFF to Azure DEV'

    dependsOn: Deploy

    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: DeployLmsWeb
        displayName: 'Deploy EnterpriseLMS BFF'

        environment: 'EnterpriseLMS-DEV'

        strategy:
          runOnce:
            deploy:
              steps:

                # Deployment consumes artifact only
                - checkout: none

                # Disable implicit artifact download
                - download: none

                # Download CI artifact
                - download: current
                  artifact: drop
                  displayName: 'Download Deployment Artifact'

                # Verify BFF deployment package
                - script: |
                    set -e

                    echo "Verifying BFF deployment package..."

                    ZIP_FILE="$(Pipeline.Workspace)/drop/LMS.Web.zip"

                    if [ ! -f "$ZIP_FILE" ]; then
                      echo "ERROR: BFF deployment ZIP not found"
                      exit 1
                    fi

                    ls -lh "$ZIP_FILE"

                    unzip -tq "$ZIP_FILE"

                    echo "BFF deployment package verified"

                  displayName: 'Verify BFF Deployment Package'

                # Deploy BFF to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy LMS.Web BFF to Azure App Service'
                  inputs:
                    azureSubscription: 'sc-enterpriselms-dev'
                    appType: 'webAppLinux'
                    appName: '$(azureBffAppName)'
                    package: '$(Pipeline.Workspace)/drop/LMS.Web.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
                    startUpCommand: 'dotnet LMS.Web.dll'

                # BFF deployment summary
                - script: |
                    echo "BFF deployment task completed."
                    echo "Application: $(azureBffAppName)"
                    echo "Build ID: $(Build.BuildId)"
                    echo "Commit: $(Build.SourceVersion)"
                    echo "Runtime verification is required."

                  displayName: 'BFF Deployment Summary'
